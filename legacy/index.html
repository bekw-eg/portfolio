<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Егеубай Бердыбек — Портфолио</title>
<meta name="description" content="Интерактивное пиксельное портфолио Егеубая Бердыбека — Software Engineer, студент 3 курса Astana IT University College.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран загрузки -->
<div class="loader" id="loader" aria-hidden="true">
  <h1 class="t">Генерация мира</h1>
  <div class="bar"><div class="fill" id="loadFill"></div></div>
  <div class="tipline" id="loadTip">Строим рельеф...</div>
</div>

<main class="scene" id="scene">
  <div class="night-sky"></div>
  <div class="stars" id="stars"></div>
  <div class="sun" id="sun"></div>
  <div id="clouds"></div>

  <!-- Главное меню -->
  <section class="menu">
    <div class="logo-wrap">
      <h1 class="logo" id="logo"></h1>
      <div class="splash" id="splash" title="Нажми меня"></div>
    </div>
    <p class="role" id="role"></p>
    <nav class="buttons">
      <button class="mc-btn wide" data-open="projects">Проекты</button>
      <button class="mc-btn" data-open="about">Обо мне</button>
      <button class="mc-btn" data-open="skills">Навыки</button>
      <button class="mc-btn" data-open="contacts">Контакты</button>
      <button class="mc-btn" data-open="achievements">Достижения</button>
    </nav>
    <p class="hint">Кликай по блокам, чтобы копать<span class="kb"> · клавиши 1–7</span></p>
  </section>

  <!-- Дерево -->
  <div class="tree" id="tree" title="Потряси дерево">
    <svg viewBox="0 0 10 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="4" y="7" width="2" height="9" fill="#6b4f2a"/>
      <rect x="5" y="7" width="1" height="9" fill="#584022"/>
      <rect x="4" y="10" width="1" height="1" fill="#7d5e33"/>
      <rect x="5" y="13" width="1" height="1" fill="#4a351c"/>
      <rect x="2" y="0" width="6" height="1" fill="#3f8f2a"/>
      <rect x="1" y="1" width="8" height="1" fill="#3f8f2a"/>
      <rect x="0" y="2" width="10" height="4" fill="#3f8f2a"/>
      <rect x="1" y="6" width="8" height="2" fill="#3f8f2a"/>
      <rect x="3" y="1" width="1" height="1" fill="#56a83a"/>
      <rect x="6" y="2" width="1" height="1" fill="#56a83a"/>
      <rect x="1" y="3" width="1" height="1" fill="#56a83a"/>
      <rect x="8" y="4" width="1" height="1" fill="#56a83a"/>
      <rect x="4" y="4" width="1" height="1" fill="#56a83a"/>
      <rect x="2" y="6" width="1" height="1" fill="#56a83a"/>
      <rect x="5" y="0" width="1" height="1" fill="#2f6f20"/>
      <rect x="0" y="5" width="1" height="1" fill="#2f6f20"/>
      <rect x="7" y="6" width="1" height="1" fill="#2f6f20"/>
      <rect x="3" y="3" width="1" height="1" fill="#2f6f20"/>
      <rect x="9" y="2" width="1" height="1" fill="#2f6f20"/>
      <rect class="apple" x="7" y="3" width="1" height="1" fill="#d8322a"/>
      <rect class="apple" x="2" y="5" width="1" height="1" fill="#d8322a"/>
    </svg>
  </div>

  <!-- Стив -->
  <div class="hero" id="hero" role="button" tabindex="0" aria-label="Стив: нажми, чтобы поговорить">
    <div class="bubble" id="bubble" hidden></div>
    <svg class="steve" viewBox="0 0 16 32" shape-rendering="crispEdges" aria-hidden="true">
      <!-- ноги -->
      <rect x="4" y="20" width="4" height="10" fill="#3b3fa3"/>
      <rect x="4" y="20" width="1" height="10" fill="#2f338a"/>
      <rect x="8" y="20" width="4" height="10" fill="#3b3fa3"/>
      <rect x="11" y="20" width="1" height="10" fill="#2f338a"/>
      <rect x="7" y="20" width="2" height="1" fill="#2f338a"/>
      <rect x="4" y="30" width="8" height="2" fill="#6b6b6b"/>
      <rect x="7" y="30" width="2" height="2" fill="#575757"/>
      <!-- тело -->
      <rect x="4" y="8" width="8" height="12" fill="#17a3a5"/>
      <rect x="4" y="18" width="8" height="2" fill="#128a8c"/>
      <rect x="11" y="8" width="1" height="10" fill="#128a8c"/>
      <rect x="7" y="8" width="2" height="1" fill="#b98a5d"/>
      <rect x="6" y="12" width="1" height="1" fill="#1bb8ba"/>
      <rect x="9" y="15" width="1" height="1" fill="#1bb8ba"/>
      <!-- левая рука -->
      <g class="arm-l">
        <rect x="0" y="8" width="4" height="4" fill="#17a3a5"/>
        <rect x="0" y="12" width="4" height="8" fill="#c39467"/>
        <rect x="0" y="12" width="1" height="8" fill="#a97b52"/>
      </g>
      <!-- голова -->
      <g class="head">
        <rect x="4" y="0" width="8" height="8" fill="#c39467"/>
        <rect x="4" y="0" width="8" height="2" fill="#3b2614"/>
        <rect x="4" y="2" width="1" height="1" fill="#3b2614"/>
        <rect x="11" y="2" width="1" height="1" fill="#3b2614"/>
        <rect x="6" y="1" width="2" height="1" fill="#4e3420"/>
        <rect x="10" y="0" width="1" height="1" fill="#4e3420"/>
        <rect x="4" y="3" width="1" height="5" fill="#b0845a"/>
        <rect x="11" y="3" width="1" height="5" fill="#b0845a"/>
        <g class="eyes">
          <rect x="5" y="4" width="1" height="1" fill="#ffffff"/>
          <rect x="6" y="4" width="1" height="1" fill="#4b3f91"/>
          <rect x="9" y="4" width="1" height="1" fill="#4b3f91"/>
          <rect x="10" y="4" width="1" height="1" fill="#ffffff"/>
        </g>
        <rect x="7" y="5" width="2" height="1" fill="#9a6441"/>
        <rect class="mouth" x="6" y="6" width="4" height="1" fill="#6e4127"/>
        <rect x="5" y="7" width="6" height="1" fill="#b0845a"/>
      </g>
      <!-- правая рука (машет) -->
      <g class="arm-r-raise">
        <g class="arm-r">
          <rect x="12" y="8" width="4" height="4" fill="#17a3a5"/>
          <rect x="12" y="12" width="4" height="8" fill="#c39467"/>
          <rect x="15" y="12" width="1" height="8" fill="#a97b52"/>
        </g>
      </g>
    </svg>
    <div class="hero-shadow"></div>
  </div>

  <div class="ground" id="ground"></div>
</main>

<!-- HUD: опыт и хотбар -->
<div class="hud">
  <div class="lvl" id="lvl">0</div>
  <div class="xpbar" id="xpbar"><div class="xpfill" id="xpfill"></div></div>
  <div class="hotbar" id="hotbar"></div>
</div>

<!-- Окно раздела -->
<div class="overlay" id="overlay" hidden>
  <div class="gui" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <h2 id="panelTitle"></h2>
    <button class="mc-btn close" id="closeBtn" aria-label="Закрыть">×</button>
    <div id="panelBody"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
